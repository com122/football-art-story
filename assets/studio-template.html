<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球员绘画动画 · 画法工作台</title>
<style>
:root{color-scheme:light;--ink:#313735;--muted:#737773;--line:#d4d5ca;--accent:#607b67;--panel:#eeeee5}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);background:#d7dadc}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7b937d;outline-offset:3px}.studio{display:grid;grid-template-columns:316px minmax(0,1fr);height:100dvh}.controls{background:var(--panel);border-right:1px solid #bcc4bd;overflow:auto;padding:26px 25px 22px}h1{font-size:23px;line-height:1.5;letter-spacing:-.5px;margin:5px 0 6px}.kicker{font-size:11px;letter-spacing:2px;color:var(--accent)}.lead{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 23px}fieldset{border:0;margin:0;padding:0}legend,.section-name{font-size:12px;font-weight:700;margin:17px 0 12px}.medium{display:grid;grid-template-columns:1fr 1fr;gap:7px}.medium button{padding:10px 4px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;font-size:13px}.medium button[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}button:hover{filter:brightness(.95)}label.row{display:block;margin:14px 0}label.row .label{display:flex;justify-content:space-between;gap:10px;font-size:12px}output{font-variant-numeric:tabular-nums;color:var(--accent)}input[type="range"]{width:100%;accent-color:var(--accent);margin:9px 0 0;height:14px}select{width:100%;background:#f7f7ef;border:1px solid var(--line);border-radius:3px;padding:8px 9px;font-size:12px}.detail{display:flex;gap:4px}.detail button{flex:1;border:1px solid var(--line);background:transparent;font-size:12px;padding:7px}.detail button.on{border-color:var(--accent);color:var(--accent);background:#e1e7dc}.check{display:flex;align-items:center;gap:7px;font-size:12px;margin:12px 0;accent-color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;border-top:1px solid var(--line);padding-top:16px;margin-top:17px}.actions button{padding:10px 4px;font-size:12px;border-radius:3px;border:1px solid var(--line);background:#f5f5ed;color:var(--ink)}.actions .primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:white}.note{font-size:11px;line-height:1.8;color:var(--muted);margin:14px 0 0}.view{min-width:0;display:flex;flex-direction:column;overflow:hidden}.top{padding:18px 26px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #bfc5c7}.top b{font-size:14px}.top span{font-size:11px;color:#626e6c}.screen-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px}.screen{position:relative;flex:none;background:#d7dadc;box-shadow:0 15px 50px #414b4518;overflow:hidden}iframe{width:1920px;height:1080px;border:0;position:absolute;left:0;top:0;transform-origin:top left;transform:scale(var(--scale,1))}.transport{padding:14px 26px 20px;border-top:1px solid #bfc5c7;display:grid;grid-template-columns:180px 1fr 65px;align-items:center;gap:20px}.transport select{background:#e8ebeb;border-color:#bec7c5}.transport input{margin:0}.transport output{font-size:12px;text-align:right}.status{font-size:11px;color:#667371}.error{color:#a14034}button:disabled{opacity:.55;cursor:wait}@media(max-width:860px){.studio{grid-template-columns:250px 1fr}.controls{padding:20px 16px}.top{padding:14px}.top span{display:none}.screen-wrap{padding:10px}.transport{padding:12px;grid-template-columns:1fr;gap:7px}.transport output{text-align:left}}@media(max-width:600px){.studio{display:flex;height:auto;min-height:100dvh;flex-direction:column-reverse}.view{height:55dvh}.controls{border-right:0;border-top:1px solid var(--line);overflow:visible}.medium{grid-template-columns:repeat(5,1fr)}.top{padding:10px 16px}.transport{display:grid;grid-template-columns:110px 1fr 44px;gap:10px}}
</style><style>[hidden]{display:none!important}</style></head><body><main class="studio">
<aside class="controls"><div class="kicker">FOOTBALL · ART STORY</div><h1>一笔一笔，画出他的生涯。</h1><p class="lead">沿用原来的横版排版。选一支笔，再调到你喜欢的感觉。</p>
<fieldset><legend>画法</legend><div class="medium" id="medium"><button type="button" data-medium="colored-pencil" aria-pressed="true">彩色铅笔</button><button type="button" data-medium="graphite" aria-pressed="false">石墨素描</button><button type="button" data-medium="watercolor" aria-pressed="false">水彩</button><button type="button" data-medium="crayon" aria-pressed="false">蜡笔</button><button type="button" data-medium="ink" aria-pressed="false">钢笔线描</button></div></fieldset>
<div class="section-name">表现方式</div><div class="detail"><button type="button" data-detail="25">概括</button><button type="button" data-detail="100">精画</button></div>
<label class="row"><span class="label">细节密度 <output id="detail-value"></output></span><input id="detail" type="range" min="10" max="100" step="1" aria-label="细节密度"></label>
<label class="row"><span class="label">笔触粗细 <output id="thickness-value"></output></span><input id="thickness" type="range" min="0.4" max="3" step="0.05" aria-label="笔触粗细"></label>
<label class="row"><span class="label">颗粒感 <output id="grain-value"></output></span><input id="grain" type="range" min="0" max="1" step="0.01" aria-label="颗粒感"></label>
<label class="row"><span class="label">笔触松散度 <output id="roughness-value"></output></span><input id="roughness" type="range" min="0" max="1" step="0.01" aria-label="笔触松散度"></label>
<label class="row" id="saturation-row"><span class="label">色彩饱和度 <output id="saturation-value"></output></span><input id="saturation" type="range" min="0" max="1.5" step="0.05" aria-label="色彩饱和度"></label>
<label class="row"><span class="label">落笔浓度 <output id="opacity-value"></output></span><input id="opacity" type="range" min="0.3" max="1.5" step="0.05" aria-label="落笔浓度"></label>
<label class="row"><span class="label">轮廓时间占比 <output id="contourFraction-value"></output></span><input id="contourFraction" type="range" min="0.1" max="0.4" step="0.01" aria-label="轮廓时间占比"></label>
<label class="row"><span class="label">人物绘制时间 <output id="drawMs-value"></output></span><input id="drawMs" type="range" min="2000" max="12000" step="100" aria-label="人物绘制时间"></label>
<label class="row"><span class="label">完成后停留 <output id="holdMs-value"></output></span><input id="holdMs" type="range" min="0" max="2500" step="100" aria-label="完成后停留"></label>
<label class="row"><span class="label">纸张底色</span><select id="paper" aria-label="纸张底色"><option value="gray">灰色素描纸</option><option value="ivory">暖白纸</option><option value="white">白纸</option></select></label>
<label class="check"><input id="showTool" type="checkbox">显示跟随笔尖</label>
<div class="actions"><button type="button" id="replay">重画这一章</button><button type="button" id="reset">恢复当前画法</button><button type="button" id="save" class="primary">保存无面板动画 HTML</button><button type="button" id="json">保存参数</button><button type="button" id="import">导入参数</button></div><input type="file" id="file" accept=".json,application/json" hidden>
<p class="note">概括速写使用独立线稿，可切换到精画比较。真实队徽默认保留彩色细节。</p></aside>
<section class="view" aria-label="动画预览"><header class="top"><div><b id="title">德布劳内 · 画法预览</b><div class="status" id="status" role="status">正在准备画纸…</div></div><span>16:9 · 保存后可用于视频转换</span></header><div class="screen-wrap" id="screen-wrap"><div class="screen" id="screen"><iframe id="film" title="球员生涯绘画动画" srcdoc="__FILM_SRCDOC__"></iframe></div></div><footer class="transport"><select id="chapter" aria-label="选择章节"></select><input id="progress" type="range" min="0" max="100" step="1" value="0" aria-label="查看绘制进度"><output id="progress-value">0%</output></footer></section>
</main><script>
__ART_SETTINGS__
const INITIAL_PROFILE=__INITIAL_PROFILE__;
let profile=INITIAL_PROFILE,art=normalizeArt(profile.art),chapters=[],ready=false,chapter=Number(new URLSearchParams(location.search).get('chapter')||2);
const film=document.getElementById('film'),byId=id=>document.getElementById(id);
function fit(){const box=byId('screen-wrap'),s=Math.min((box.clientWidth-30)/1920,(box.clientHeight-30)/1080);byId('screen').style.width=1920*s+'px';byId('screen').style.height=1080*s+'px';film.style.setProperty('--scale',s);}
new ResizeObserver(fit).observe(byId('screen-wrap'));addEventListener('resize',fit);fit();
function send(data){if(ready)film.contentWindow.postMessage(data,'*');}
function status(text,error=false){byId('status').textContent=text;byId('status').classList.toggle('error',error);}
function reflect(){
 document.querySelectorAll('[data-medium]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.medium===art.medium));document.querySelectorAll('[data-detail]').forEach(b=>b.classList.toggle('on',Number(b.dataset.detail)===(art.drawingMode==='sketch'?25:100)));
 byId('detail').closest('label').hidden=true;byId('contourFraction').closest('label').hidden=art.drawingMode==='sketch';byId('roughness').closest('label').hidden=art.drawingMode==='sketch';
 for(const key of Object.keys(ART_RANGES)){byId(key).value=art[key];byId(key+'-value').textContent=key.endsWith('Ms')?(art[key]/1000).toFixed(1)+' 秒':key==='detail'?Math.round(art[key])+'%':key==='thickness'?art[key].toFixed(2)+'×':Math.round(art[key]*100)+'%';}
 byId('paper').value=art.paper;byId('showTool').checked=art.showTool;byId('saturation-row').hidden=['graphite','ink'].includes(art.medium);
}
function apply(){reflect();byId('progress').value=0;byId('progress-value').textContent='播放中';send({type:'art:apply',art,chapter});status('正在重画 · '+ART_PRESETS[art.medium].label);}
let timer;
for(const key of Object.keys(ART_RANGES))byId(key).oninput=()=>{art[key]=Number(byId(key).value);reflect();clearTimeout(timer);timer=setTimeout(apply,140);};
document.querySelectorAll('[data-medium]').forEach(b=>b.onclick=()=>{art=normalizeArt({medium:b.dataset.medium,drawingMode:art.drawingMode,drawMs:art.drawMs,holdMs:art.holdMs,paper:art.paper,showTool:art.showTool,seed:art.seed});apply();});
document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{
 art.detail=Number(b.dataset.detail);art.drawingMode=art.detail===25?'sketch':'detailed';const base=ART_PRESETS[art.medium];
 art.thickness=base.thickness*(art.detail===25?1.15:1);
 art.roughness=art.detail===25?Math.max(base.roughness,.22):base.roughness;apply();
});
byId('paper').onchange=()=>{art.paper=byId('paper').value;apply();};byId('showTool').onchange=()=>{art.showTool=byId('showTool').checked;apply();};
byId('replay').onclick=()=>{byId('progress').value=0;byId('progress-value').textContent='播放中';send({type:'art:replay',chapter});};
byId('reset').onclick=()=>{art=normalizeArt({medium:art.medium});apply();};
byId('chapter').onchange=()=>{chapter=Number(byId('chapter').value);send({type:'art:replay',chapter});};
byId('progress').oninput=()=>{const p=Number(byId('progress').value);byId('progress-value').textContent=p+'%';send({type:'art:seek',chapter,ms:(chapters[chapter]?.drawEnd||art.drawMs)*p/100});};
addEventListener('message',e=>{
 if(e.source!==film.contentWindow)return;const d=e.data;if(d?.type==='art:error'){status(d.message,true);return;}if(d?.type!=='art:state')return;
 const first=!ready;ready=true;profile=d.profile;chapters=d.chapters;chapter=Math.max(0,Math.min(chapters.length-1,chapter));
 byId('chapter').replaceChildren(...chapters.map((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;return o;}));byId('chapter').value=chapter;
 byId('title').textContent=profile.player.name+' · 画法预览';status(ART_PRESETS[art.medium].label+' · 全片 '+(chapters.reduce((sum,c)=>sum+c.duration,0)/1000).toFixed(1)+' 秒');
 if(first)send({type:'art:replay',chapter});
});
function download(name,type,text){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
byId('json').onclick=()=>download('绘画参数.json','application/json',JSON.stringify({schemaVersion:1,art},null,2));
byId('import').onclick=()=>byId('file').click();byId('file').onchange=async()=>{try{const data=JSON.parse(await byId('file').files[0].text());if(data.schemaVersion!==1)throw Error('参数版本不支持');art=normalizeArt(data.art);apply();}catch(e){status('导入失败：'+e.message,true);}byId('file').value='';};
byId('save').onclick=()=>{
 clearTimeout(timer);profile.art=art;profile.timing.portraitMs=art.drawMs;profile.timing.holdMs=art.holdMs;profile.timing.introMs=Math.min(3800,art.drawMs);
 const safe=JSON.stringify(profile).replaceAll('<','\\u003c');let inner=film.getAttribute('srcdoc').replace(/const PROFILE=[\s\S]*?;\nconst esc=/,'const PROFILE='+safe+';\nconst esc=');
 const attr=inner.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 const html='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球员绘画动画</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#D7DADC}iframe{position:fixed;left:50%;top:50%;width:1920px;height:1080px;border:0;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}</style></head><body><iframe title="球员绘画动画" srcdoc="'+attr+'"></iframe><scr'+'ipt>function fit(){document.documentElement.style.setProperty("--scale",Math.min(innerWidth/1920,innerHeight/1080))}addEventListener("resize",fit);fit();</scr'+'ipt></body></html>';
 download(profile.player.name+'-'+art.medium+'-动画.html','text/html',html);status('已保存动画 HTML · '+ART_PRESETS[art.medium].label);
};reflect();
</script></body></html>
