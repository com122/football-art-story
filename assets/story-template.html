<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>球员生涯彩色素描动画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;700;900&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#D7DADC; --paper2:#C9CDD1; --graphite:#2A2D32; --lead:#666B73; --chalk:#FBFBF8;
  --accent:#6CABDD;
  --num:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1D2125;--paper2:#262B30;--graphite:#DADDE0;--lead:#8A9098;--chalk:#FFFFFF;}
}
:root[data-theme="dark"]{--paper:#1D2125;--paper2:#262B30;--graphite:#DADDE0;--lead:#8A9098;--chalk:#FFFFFF;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--graphite);font-family:var(--serif);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .52  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #grain{mix-blend-mode:screen;opacity:.18}}
:root[data-theme="dark"] #grain{mix-blend-mode:screen;opacity:.18}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.14) 100%)}

#stage{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 calc(64px + env(safe-area-inset-bottom,0px));pointer-events:none}
.panel{position:absolute;pointer-events:auto}
#chap{left:clamp(20px,5vw,80px);top:50%;transform:translateY(-54%);width:min(36vw,520px)}
@media (max-aspect-ratio:21/20){
  #chap{left:20px;right:20px;width:auto;top:calc(env(safe-area-inset-top,0px) + 18px);transform:none}
}
.yr{font-family:var(--num);font-weight:900;font-size:clamp(64px,10vw,150px);line-height:.86;letter-spacing:-.01em;
  color:transparent;-webkit-text-stroke:1.4px var(--graphite);
  background:repeating-linear-gradient(-58deg,var(--graphite) 0 1.2px,transparent 1.2px 6px);-webkit-background-clip:text;background-clip:text}
.club{font-weight:900;font-size:clamp(26px,3.2vw,46px);margin:.28em 0 .1em;line-height:1.15}
.club small{display:block;font-family:var(--num);font-weight:700;font-size:.5em;letter-spacing:.04em;color:var(--lead);margin-top:.2em}
.body{font-size:clamp(14px,1.18vw,17px);line-height:1.85;margin:.9em 0 1.1em;max-width:30em}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0;padding:0;list-style:none}
.facts li{border-top:1.5px solid var(--accent);padding-top:6px;min-width:6em}
.facts b{display:block;font-family:var(--num);font-weight:900;font-size:clamp(28px,3vw,42px);line-height:1}
.facts span{font-size:13px;color:var(--lead)}
@media (max-aspect-ratio:21/20){.yr{font-size:clamp(54px,16vw,96px)}.body{font-size:14px;line-height:1.7;margin:.5em 0 .7em}.facts b{font-size:26px}}

.rv{clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.6,.05,.25,1);transition-delay:var(--d,0s)}
.show .rv{clip-path:inset(0 -2% 0 0)}

#intro{left:clamp(20px,6vw,110px);top:50%;transform:translateY(-50%);max-width:min(48vw,720px)}
#intro h1{margin:0;white-space:nowrap;font-weight:900;font-size:clamp(40px,6.2vw,108px);line-height:1.02;letter-spacing:.02em}
#intro .en{font-family:var(--num);font-weight:300;font-size:clamp(22px,2.6vw,40px);letter-spacing:.12em;margin-top:.15em;color:var(--lead)}
#intro p{font-size:clamp(15px,1.3vw,19px);line-height:1.9;margin:1.4em 0 0;max-width:24em}
@media (max-aspect-ratio:21/20){#intro{top:calc(env(safe-area-inset-top,0px) + 30px);transform:none;max-width:none;right:20px}}

#career{inset:0;padding:calc(env(safe-area-inset-top,0px) + 3.5vh) clamp(20px,5vw,80px) calc(84px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:2.4vh}
#career>:first-child{margin-top:auto}#career>:last-child{margin-bottom:auto}
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.ch h2{margin:0;font-weight:900;font-size:clamp(28px,3.4vw,52px)}
.ch p{margin:.3em 0 0;color:var(--lead);font-size:15px}
.tot{display:flex;align-items:flex-end;gap:12px}
.tot b{font-family:var(--num);font-weight:900;font-size:clamp(60px,7.5vw,120px);line-height:.82;color:transparent;-webkit-text-stroke:1.4px var(--graphite);background:repeating-linear-gradient(-58deg,var(--graphite) 0 1.2px,transparent 1.2px 6px);-webkit-background-clip:text;background-clip:text}
.tot span{font-size:13px;line-height:1.5;color:var(--lead)}
.tbl{display:grid;gap:min(10px,1.3vh)}
.th,.tr{display:grid;grid-template-columns:64px minmax(7.5em,1fr) minmax(0,2.6fr) 4.2em minmax(10em,1.5fr);align-items:center;gap:0 18px}
.th span{font-size:13px;color:var(--lead)}
.th span:nth-child(4){text-align:right}
.tr{padding:min(8px,1vh) 0;border-top:1px solid color-mix(in srgb,var(--graphite) 18%,transparent)}
.tr.nat{border-top:1.5px dashed color-mix(in srgb,var(--graphite) 45%,transparent);margin-top:6px;padding-top:12px}
.jy{width:60px;height:58px;display:block}
.tn b{display:block;font-size:clamp(16px,1.35vw,20px)}
.tn small{font-family:var(--num);font-weight:700;font-size:13px;color:var(--lead);letter-spacing:.02em}
.ta{display:flex;align-items:center;gap:12px;min-width:0}
.ta .bar{flex:1;height:18px;min-width:0}
.ta em i{font-style:normal}
.ta em{font-style:normal;font-family:var(--num);font-weight:900;font-size:clamp(24px,2.3vw,36px);min-width:2.6em}
.bar path{fill:none;stroke-width:3.2;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;opacity:.9;transition:stroke-dashoffset 1.6s cubic-bezier(.5,0,.2,1);transition-delay:calc(var(--d,0s) + .3s)}
.show .bar path{stroke-dashoffset:0}
.tg{font-family:var(--num);font-weight:900;font-size:clamp(24px,2.3vw,36px);text-align:right}
.th2{font-size:13.5px;line-height:1.5;color:var(--lead)}
@media (max-width:820px){
 .th{display:none}
 .tr{grid-template-columns:40px 1fr auto;grid-template-areas:"j n g" "a a a" "h h h";gap:4px 12px}
 .jy{grid-area:j;width:38px;height:36px}.tn{grid-area:n}.ta{grid-area:a}.tg{grid-area:g}.tg::after{content:" 球";font-size:14px;font-family:var(--serif);font-weight:400;color:var(--lead)}
 .ta em::after{content:" 场";font-size:14px;font-family:var(--serif);font-weight:400;color:var(--lead)}
 .th2{grid-area:h}
}

#stats{inset:0;padding:calc(env(safe-area-inset-top,0px) + 3vh) clamp(20px,5vw,80px) calc(84px + env(safe-area-inset-bottom,0px));overflow:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:2.4vh 5vw;align-content:center}
#stats h2{grid-column:1/-1;margin:0;font-weight:900;font-size:clamp(28px,3.4vw,52px)}
#stats h2 small{font-family:var(--num);font-weight:300;font-size:.5em;letter-spacing:.1em;color:var(--lead);margin-left:.5em}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:min(22px,2.4vh) 30px;align-content:start}
.big div{border-left:2px solid var(--accent);padding-left:14px}
.big b{display:block;font-family:var(--num);font-weight:900;font-size:clamp(44px,min(5.2vw,8.4vh),88px);line-height:.9}
.big span{font-size:13.5px;line-height:1.55;color:var(--lead);display:block;margin-top:6px}
.hon{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;align-items:center;align-content:start}
.hon .n{font-size:15px;white-space:nowrap}
.hon svg{height:26px;overflow:visible}
.hon svg path{fill:none;stroke:var(--graphite);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 2.2s ease-out;transition-delay:calc(var(--d,0s) + .5s)}
.show .hon svg path{stroke-dashoffset:0}
.hon h3,.ind h3{grid-column:1/-1;margin:0 0 4px;font-size:16px;font-weight:700;color:var(--lead)}
.ind{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14.5px;line-height:1.6}
.ind h3{width:100%}
.ind span b{font-family:var(--num);font-weight:700;font-size:20px;margin-right:6px}
.note{grid-column:1/-1;font-size:12px;color:var(--lead);line-height:1.6;margin:0}
#replay{font:inherit;font-size:14px;border:1.5px solid var(--graphite);background:transparent;color:var(--graphite);padding:8px 18px;border-radius:999px;cursor:pointer;justify-self:start}
@media (max-width:820px){#stats{grid-template-columns:1fr;align-content:start}#stats h2 small{display:block;margin:.3em 0 0}.big b{font-size:48px}}

#bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--paper) 35%);padding:0 clamp(12px,3vw,40px) calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:center;gap:12px;height:calc(64px + env(safe-area-inset-bottom,0px))}
#bar>button{width:38px;height:38px;flex:none;border:1.5px solid var(--graphite);border-radius:50%;background:transparent;color:var(--graphite);cursor:pointer;display:grid;place-items:center;padding:0}
#bar>button svg{width:16px;height:16px}
#bar button:focus-visible,.seg:focus-visible,#replay:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#track{flex:1;display:flex;gap:4px;align-items:flex-end;height:38px}
.seg{position:relative;height:100%;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;border:0;background:none;padding:0;color:var(--lead);font:inherit;text-align:left;min-width:0}
.seg i{display:block;height:3px;background:color-mix(in srgb,var(--graphite) 22%,transparent);position:relative;overflow:hidden;border-radius:2px}
.seg i::after{content:"";position:absolute;inset:0;background:var(--graphite);transform-origin:left;transform:scaleX(var(--p,0))}
.seg em{font-style:normal;font-family:var(--num);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on em{color:var(--graphite)}
@media (max-width:700px){.seg em{display:none}#track{height:20px}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.rv,.bar path,.hon svg path{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="grain"></div><div id="vig"></div>

<main id="stage" aria-live="polite">
  <section class="panel" id="intro" hidden></section>
  <section class="panel" id="career" hidden></section>
  <section class="panel" id="chap" hidden></section>
  <section class="panel" id="stats" hidden></section>
</main>

<nav id="bar" aria-label="播放控制">
  <button id="prev" aria-label="上一章"><svg viewBox="0 0 16 16"><path d="M11 2 4 8l7 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button id="play" aria-label="暂停"><svg viewBox="0 0 16 16" id="playIco"></svg></button>
  <button id="next" aria-label="下一章"><svg viewBox="0 0 16 16"><path d="m5 2 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <div id="track"></div>
</nav>

<script>
(async()=>{
"use strict";
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- data ---------- */
const PROFILE=__PROFILE_JSON__;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const CH=PROFILE.chapters.map(d=>({...d,y:d.year,club:d.title,sub:d.subtitle||'',c:d.accent||PROFILE.player.accent,age:d.age||'',f:d.facts.map(f=>[f.value,f.label])}));
document.title=PROFILE.player.name+'：一支铅笔画完的生涯';
document.getElementById('intro').innerHTML='<h1 class="rv">'+esc(PROFILE.player.name)+'</h1><div class="en rv" style="--d:.25s">'+esc(PROFILE.player.latinName)+'</div><p class="rv" style="--d:.6s">'+esc(PROFILE.player.intro)+'</p>';

/* ---------- utils ---------- */
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function Kit(seed){
  const r=mul(seed), S=[], J=m=>(r()-.5)*m;
  function mk(pts,o){
    const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    const s={pts,cum,len:cum[cum.length-1]||1,c:o.c||'g',w:o.w||1.4,a:o.a??.9,t0:0,t1:1,acc:o.acc};S.push(s);return s}
  function line(a,b,o={},j=1.2,over=.06){
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,n=Math.max(3,Math.ceil(L/9)),bow=J(2)*Math.min(L*(o.bow??.03),7);
    const t0=-over*(.3+r()),t1=1+over*(.3+r()),pts=[];
    for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n,b=Math.sin(Math.PI*i/n)*bow;pts.push([a[0]+dx*t+nx*b+J(j),a[1]+dy*t+ny*b+J(j)])}
    return mk(pts,o)}
  function curve(c,o={},j=.8,step=7){
    const P=[c[0],...c,c[c.length-1]],pts=[];
    for(let i=1;i<P.length-2;i++){const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2],L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]),n=Math.max(2,Math.ceil(L/step));
      for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
        const f=(a,b,c2,d)=>.5*(2*b+(-a+c2)*t+(2*a-5*b+4*c2-d)*t2+(-a+3*b-3*c2+d)*t3);
        pts.push([f(p0[0],p1[0],p2[0],p3[0])+J(j),f(p0[1],p1[1],p2[1],p3[1])+J(j)])}}
    pts.push(c[c.length-1]);return mk(pts,o)}
  function ell(cx,cy,rx,ry,o={},j=.8,laps=1.12,rot=0){
    const a0=r()*6.28,n=Math.max(16,Math.ceil((rx+ry)*laps/2.2)),pts=[],cr=Math.cos(rot),sr=Math.sin(rot);
    for(let i=0;i<=n;i++){const a=a0+6.2832*laps*i/n,k=1+J(.04*Math.min(1,20/Math.max(rx,ry))),x=Math.cos(a)*rx*k,y=Math.sin(a)*ry*k;pts.push([cx+x*cr-y*sr+J(j),cy+x*sr+y*cr+J(j)])}
    return mk(pts,o)}
  function hatch(poly,ang,gap,o={},j=.6){
    const d=[Math.cos(ang),Math.sin(ang)],nn=[-d[1],d[0]],pr=poly.map(p=>p[0]*nn[0]+p[1]*nn[1]),mn=Math.min(...pr),mx=Math.max(...pr);
    let flip=false;
    for(let c=mn+gap*(.3+r()*.5);c<mx;c+=gap*(.8+r()*.4)){
      const hits=[];
      for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],da=pr[i]-c,db=pr[(i+1)%poly.length]-c;
        if(da*db<0){const t=da/(da-db),x=A[0]+(B[0]-A[0])*t,y=A[1]+(B[1]-A[1])*t;hits.push([x,y,x*d[0]+y*d[1]])}}
      hits.sort((p,q)=>p[2]-q[2]);
      for(let i=0;i+1<hits.length;i+=2){let a=hits[i],b=hits[i+1];if(flip)[a,b]=[b,a];
        const s1=r()*.12,s2=1-r()*.12;line(lerp(a,b,s1),lerp(a,b,s2),{...o,bow:.01},j,0)}
      flip=!flip}}
  function text(str,x,y,o){const s={type:'text',str,x,y,font:o.font,c:o.c||'g',a:o.a??1,align:o.align||'left',mode:o.mode||'fill',w:o.w||1,len:o.len||160,t0:0,t1:1};S.push(s);return s}
  function phase(T0,T1,fn,ov=.4){const i0=S.length;fn();const arr=S.slice(i0);if(!arr.length)return;
    const tot=arr.reduce((s,x)=>s+x.len+16,0);let acc=0;
    for(const s of arr){const st=T0+(T1-T0)*acc/tot;acc+=s.len+16;const en=T0+(T1-T0)*acc/tot;s.t0=st;s.t1=en+(en-st)*ov+60}}
  return {r,J,S,line,curve,ell,hatch,text,phase,mk}
}

/* ---------- drawing builders ---------- */
function ellPoly(cx,cy,rx,ry,n=18){const p=[];for(let i=0;i<n;i++){const a=i/n*6.2832;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function limbC(A,B,wa,wm,wb,fm=.32){
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,n=[-dy/L,dx/L];
  const off=(p,w)=>[p[0]+n[0]*w,p[1]+n[1]*w];
  const wAt=f=>f<fm?wa+(wm-wa)*f/fm:wm+(wb-wm)*(f-fm)/(1-fm);
  const at=(f,s)=>off(lerp(A,B,f),s*wAt(f));
  const poly=[];for(const f of[0,.25,.5,.75,1])poly.push(at(f,1));for(const f of[1,.75,.5,.25,0])poly.push(at(f,-1));
  return{at,poly,A,B}}
const isWhite=c=>/^#f/i.test(c);

function ball(K,cx,cy,r,T0,T1,lw){
  K.phase(T0,T1,()=>{
    K.ell(cx,cy,r,r,{c:'g',w:lw*1.3},.4,1.15);
    const pent=[];for(let i=0;i<5;i++){const a=-1.57+i*1.2566;pent.push([cx+Math.cos(a)*r*.38,cy+Math.sin(a)*r*.38])}
    K.hatch(pent,-.8,r*.09,{c:'g',w:lw*.7,a:.9});
    for(const p of pent){const d=[p[0]-cx,p[1]-cy];K.line(p,[cx+d[0]*2.4,cy+d[1]*2.4],{c:'g',w:lw*.7,a:.7},.2,0)}
    K.hatch(ellPoly(cx+r*.25,cy+r*.25,r*.7,r*.7,14),-.8,r*.16,{c:'g',w:lw*.5,a:.35});
    K.curve([[cx-r*.75,cy-r*.2],[cx-r*.5,cy-r*.65],[cx-r*.05,cy-r*.85]],{c:'k',w:lw*2,a:.95},.2);
  },.3)}

function benchScene(K,T0,T1,number,appearances,clubColor){
  const sp=T1-T0,ph=(a,b)=>[T0+sp*a,T0+sp*b];
  K.phase(...ph(0,.35),()=>{
    const o={c:'g',w:2.2};
    K.curve([[110,350],[190,215],[500,160],[810,215],[890,350]],o,.6);
    K.curve([[160,352],[235,250],[500,205],[765,250],[840,352]],o,.6);
    K.line([110,350],[160,352],o);K.line([890,350],[840,352],o);
    K.line([165,560],[835,560],{c:'g',w:1.8});K.line([110,350],[110,640],{c:'g',w:1.8});K.line([890,350],[890,640],{c:'g',w:1.8});
    K.line([60,640],[940,640],{c:'l',w:1.6,a:.7});
  });
  const seats=[220,332,444,556,668,780];
  K.phase(...ph(.25,.62),()=>{
    seats.forEach(x=>{const o={c:'g',w:1.8};
      K.curve([[x-40,525],[x-44,440],[x,418],[x+44,440],[x+40,525]],o,.4);
      K.curve([[x-46,530],[x,548],[x+46,530]],o,.4);K.line([x-46,530],[x+46,530],{c:'g',w:1.2,a:.6});

      ctx.save();ctx.font=s.font;ctx.textAlign=s.align;ctx.textBaseline='alphabetic';
      const w=ctx.measureText(s.str).width,x0=s.align==='center'?s.x-w/2:s.align==='right'?s.x-w:s.x;
      ctx.beginPath();ctx.rect(x0-10,s.y-1000,(w+20)*p,1200);ctx.clip();

  }

  if(data.type==='art:apply'){
   PROFILE.art=normalizeArt(data.art);PROFILE.timing.portraitMs=PROFILE.art.drawMs;PROFILE.timing.holdMs=PROFILE.art.holdMs;
   PORTRAIT_END=PROFILE.art.drawMs;PROFILE.timing.introMs=Math.min(3800,PORTRAIT_END);INTRO_END=PROFILE.timing.introMs;HOLD_AFTER_DRAW=PROFILE.art.holdMs;
   pencilCache.clear();applyPaper();
   for(const plan of crestPlans)plan.stroke.t1=plan.stroke.t0+2200*(PORTRAIT_END/6800);
   for(const sc of scenes){sc.strokes=sc.build({land:true});sc.drawEnd=Math.ceil(Math.max(domAnimationEnd(sc),0,...sc.strokes.map(s=>s.t1),...(sc.balls||[]).map(b=>b.t1)));sc.dur=sc.drawEnd+HOLD_AFTER_DRAW;}
   segs.forEach((s,i)=>s.style.flex=scenes[i].dur);window.__chapterTimings=studioState().chapters;
   go(data.chapter??Math.max(0,cur));paused=false;setIco();
  }else if(data.type==='art:seek'){window.__seek(data.chapter,data.ms);}
  else if(data.type==='art:replay'){go(data.chapter??Math.max(0,cur));paused=false;setIco();}
  parent.postMessage(studioState(),'*');
 }catch(error){parent.postMessage({type:'art:error',message:error.message},'*');}
});
cv.addEventListener('click',()=>go(cur+1));
setIco();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>makePats(scenes[cur]?.data?scenes[cur].data.c:PROFILE.player.accent));
new MutationObserver(()=>makePats(scenes[cur]?.data?scenes[cur].data.c:PROFILE.player.accent)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(resize,120)});
resize();
const preview=new URLSearchParams(location.search);if(preview.get('theme')!=='dark')document.documentElement.dataset.theme='light';
const begin=()=>{applyPaper();go(preview.has('chapter')?Math.max(0,Math.min(scenes.length-1,+preview.get('chapter'))):0);if(preview.has('at')){paused=true;pauseAt=performance.now();start=pauseAt-(+preview.get('at'));setIco()}requestAnimationFrame(frame);if(parent!==window)parent.postMessage(studioState(),'*');};
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(begin);
})();
</script>
